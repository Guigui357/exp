<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS WebKit Fuzzer</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
        #status { margin-bottom: 10px; }
        #log { height: 300px; overflow-y: scroll; border: 1px solid #0f0; padding: 10px; background: #000; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        .crash { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>WebKit HTML/CSS/Layout Fuzzer</h1>
    <div id="status">Crashes: <span id="crashCount">0</span></div>
    <button id="startBtn">Start Fuzzing</button>
    <button id="stopBtn" disabled>Stop</button>
    <div id="log"></div>
    <div id="target" style="position: absolute; top: -9999px; left: -9999px;"></div>

    <script>
        let fuzzing = false;
        let crashCount = 0;
        const logDiv = document.getElementById('log');
        const targetDiv = document.getElementById('target');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const countSpan = document.getElementById('crashCount');

        // Random string generator
        function randStr(len) {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<>"/';
            let result = '';
            for (let i = 0; i < len; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Generate random HTML tags with attributes
        function generateHTML() {
            const tags = ['div', 'span', 'p', 'a', 'img', 'script', 'style', 'table', 'tr', 'td', 'ul', 'li', 'input', 'select', 'textarea'];
            const attrs = ['class', 'id', 'href', 'src', 'onclick', 'onerror', 'style', 'data-', 'aria-', 'hidden', 'disabled', 'checked'];
            
            let html = '';
            const numElements = Math.floor(Math.random() * 20) + 5; // 5-25 elements
            
            for (let i = 0; i < numElements; i++) {
                const tag = tags[Math.floor(Math.random() * tags.length)];
                const hasAttr = Math.random() > 0.3;
                
                html += `<${tag}`;
                
                if (hasAttr) {
                    const attr = attrs[Math.floor(Math.random() * attrs.length)];
                    const val = randStr(Math.floor(Math.random() * 50));
                    html += ` ${attr}="${val}"`;
                    
                    // Sometimes add nested styles or events
                    if (Math.random() > 0.8) {
                        html += ` onclick="alert(1)"`;
                    }
                }
                
                // Randomly close or leave open
                if (Math.random() > 0.5) {
                    html += `>`;
                    if (Math.random() > 0.7) {
                        html += randStr(Math.floor(Math.random() * 100));
                    }
                    html += `</${tag}>`;
                } else {
                    html += ` />`; // Self-close some tags
                }
            }
            
            // Add some weird nesting
            if (Math.random() > 0.8) {
                html = `<div style="display:flex"><div style="width:${randStr(10)}">${html}</div></div>`;
            }
            
            return html;
        }

        // Fuzz CSS properties too
        function generateCSSFuzz() {
            const props = ['margin', 'padding', 'border', 'width', 'height', 'transform', 'opacity', 'z-index', 'position', 'top', 'left', 'right', 'bottom', 'flex', 'grid', 'display'];
            const values = ['auto', '100%', '0', 'inherit', 'initial', 'unset', 'none', 'solid', 'dashed', 'dotted', 'red', 'blue', '#fff', 'rgb(255,0,0)', 'translateX(10px)', 'rotate(45deg)', 'scale(1.5)'];
            
            let css = '';
            const numProps = Math.floor(Math.random() * 10) + 1;
            
            for (let i = 0; i < numProps; i++) {
                const prop = props[Math.floor(Math.random() * props.length)];
                const val = values[Math.floor(Math.random() * values.length)];
                css += `${prop}: ${val}; `;
            }
            
            return css;
        }

        function log(msg) {
            const entry = document.createElement('div');
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function fuzzLoop() {
            while (fuzzing) {
                try {
                    // Clear previous content
                    targetDiv.innerHTML = '';
                    
                    // Generate random HTML
                    const htmlContent = generateHTML();
                    
                    // Inject HTML
                    targetDiv.innerHTML = htmlContent;

                    // Inject random CSS to stress the renderer
                    const styleTag = document.createElement('style');
                    styleTag.textContent = `
                        .fuzz-test {
                            ${generateCSSFuzz()}
                        }
                    `;
                    document.head.appendChild(styleTag);

                    // Force reflow/layout calculation
                    // This is where layout bugs (crashes) usually happen
                    void targetDiv.offsetWidth; 
                    void targetDiv.offsetHeight;
                    
                    // Trigger paint
                    requestAnimationFrame(() => {
                        // Remove the style tag to prevent memory leaks from previous iterations
                        if (document.contains(styleTag)) {
                            document.head.removeChild(styleTag);
                        }
                    });

                } catch (e) {
                    crashCount++;
                    countSpan.textContent = crashCount;
                    log(`CRASH DETECTED: ${e.message}`);
                    // Optional: pause or continue after crash
                    // await new Promise(r => setTimeout(r, 100)); 
                }
            }
        }

        startBtn.addEventListener('click', () => {
            fuzzing = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            log("Fuzzing started...");
            fuzzLoop();
        });

        stopBtn.addEventListener('click', () => {
            fuzzing = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            log("Fuzzing stopped.");
        });
    </script>
</body>
</html>
