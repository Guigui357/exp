<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">

<title>Paper RAM Reader</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        text-align: center;
    }

    h1 {
        font-size: 24px;
        margin: 18px 0 5px;
    }

    #status {
        color: #aaa;
        margin-bottom: 12px;
    }

    #cameraBox {
        position: relative;
        width: 95vw;
        max-width: 600px;
        margin: auto;
        overflow: hidden;
        border-radius: 12px;
        background: black;
    }

    video {
        width: 100%;
        display: block;
    }

    /*
       Área onde o byte deve aparecer.
       8 células = 8 bits
    */
    #scanArea {
        position: absolute;
        left: 5%;
        right: 5%;
        top: 40%;
        height: 20%;

        border: 3px solid red;
        pointer-events: none;
    }

    #bits {
        font-family: monospace;
        font-size: 32px;
        letter-spacing: 5px;
        margin: 20px 0 5px;
    }

    #hex {
        font-family: monospace;
        font-size: 25px;
    }

    #decimal {
        margin-top: 5px;
        color: #aaa;
    }

    button {
        border: 0;
        border-radius: 10px;
        padding: 14px 20px;
        margin: 8px;
        font-size: 17px;
        font-weight: bold;
    }

    #start {
        background: white;
        color: black;
    }

    #stop {
        background: #444;
        color: white;
    }

    #calibrate {
        background: #333;
        color: white;
    }

    canvas {
        display: none;
    }
</style>
</head>

<body>

<h1>📄 Paper RAM Reader</h1>

<div id="status">
    Pressione "Iniciar câmera"
</div>

<div id="cameraBox">

    <video id="video"
           autoplay
           playsinline
           muted>
    </video>

    <div id="scanArea"></div>

</div>

<div>
    <button id="start">
        📷 Iniciar câmera
    </button>

    <button id="stop">
        ⛔ Parar
    </button>

    <button id="calibrate">
        ⚙️ Calibrar
    </button>
</div>

<div id="bits">
    --------
</div>

<div id="hex">
    0x00
</div>

<div id="decimal">
    Decimal: 0
</div>

<canvas id="canvas"></canvas>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d", {
    willReadFrequently: true
});

const statusText = document.getElementById("status");
const bitsText = document.getElementById("bits");
const hexText = document.getElementById("hex");
const decimalText = document.getElementById("decimal");

let stream = null;
let running = false;

/*
    Threshold de luminosidade.

    Quanto MENOR o valor,
    mais escuro precisa estar
    para ser considerado "1".
*/
let threshold = 130;


/*
    Layout do byte.

    O retângulo vermelho é dividido
    em 8 partes iguais.
*/
const CELLS = 8;


/*
    Iniciar câmera
*/
async function startCamera() {

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: "environment"
                },
                width: {
                    ideal: 1280
                },
                height: {
                    ideal: 720
                }
            },
            audio: false
        });

        video.srcObject = stream;

        await video.play();

        running = true;

        statusText.textContent =
            "Câmera ativa — enquadre o byte";

        requestAnimationFrame(readFrame);

    } catch (error) {

        console.error(error);

        statusText.textContent =
            "Erro ao acessar a câmera: " + error.message;
    }
}


/*
    Parar câmera
*/
function stopCamera() {

    running = false;

    if (stream) {

        for (const track of stream.getTracks()) {
            track.stop();
        }

        stream = null;
    }

    video.srcObject = null;

    statusText.textContent =
        "Câmera parada";
}


/*
    Calcula luminosidade média
    de uma região.
*/
function averageBrightness(
    imageData,
    x,
    y,
    width,
    height
) {

    const data = imageData.data;

    let total = 0;
    let count = 0;

    /*
       Ignoramos uma borda da célula.
       Isso reduz interferência das linhas
       do caderno.
    */

    const marginX = Math.floor(width * 0.20);
    const marginY = Math.floor(height * 0.20);

    const startX = x + marginX;
    const endX = x + width - marginX;

    const startY = y + marginY;
    const endY = y + height - marginY;

    for (let py = startY; py < endY; py++) {

        for (let px = startX; px < endX; px++) {

            const index =
                (py * imageData.width + px) * 4;

            const r = data[index];
            const g = data[index + 1];
            const b = data[index + 2];

            /*
                Luminância aproximada.
            */
            const brightness =
                0.299 * r +
                0.587 * g +
                0.114 * b;

            total += brightness;
            count++;
        }
    }

    return count > 0
        ? total / count
        : 255;
}


/*
    Ler um frame da câmera.
*/
function readFrame() {

    if (!running) {
        return;
    }

    if (video.readyState < 2) {

        requestAnimationFrame(readFrame);
        return;
    }

    const width = video.videoWidth;
    const height = video.videoHeight;

    if (!width || !height) {

        requestAnimationFrame(readFrame);
        return;
    }

    canvas.width = width;
    canvas.height = height;

    /*
        Copia o frame da câmera.
    */
    ctx.drawImage(
        video,
        0,
        0,
        width,
        height
    );

    /*
        Área de leitura.
    */
    const areaX = Math.floor(width * 0.05);
    const areaY = Math.floor(height * 0.40);

    const areaWidth =
        Math.floor(width * 0.90);

    const areaHeight =
        Math.floor(height * 0.20);

    const imageData =
        ctx.getImageData(
            areaX,
            areaY,
            areaWidth,
            areaHeight
        );

    /*
        Cada célula representa um bit.
    */
    let bits = "";

    for (let i = 0; i < CELLS; i++) {

        const cellX =
            Math.floor(
                i * areaWidth / CELLS
            );

        const nextX =
            Math.floor(
                (i + 1) * areaWidth / CELLS
            );

        const cellWidth =
            nextX - cellX;

        const brightness =
            averageBrightness(
                imageData,
                cellX,
                0,
                cellWidth,
                areaHeight
            );

        /*
            Escuro = 1
            Claro = 0
        */
        const bit =
            brightness < threshold
                ? "1"
                : "0";

        bits += bit;
    }

    displayByte(bits);

    requestAnimationFrame(readFrame);
}


/*
    Converter 8 bits
    para número.
*/
function displayByte(bits) {

    if (bits.length !== 8) {
        return;
    }

    const value =
        parseInt(bits, 2);

    bitsText.textContent = bits;

    hexText.textContent =
        "0x" +
        value
            .toString(16)
            .toUpperCase()
            .padStart(2, "0");

    decimalText.textContent =
        "Decimal: " + value;
}


/*
    Calibração simples.

    Coloque papel LIMPO na área
    e pressione calibrar.

    O programa usa a luminosidade
    atual para definir o threshold.
*/
document
    .getElementById("calibrate")
    .addEventListener("click", () => {

        if (!video.videoWidth) {

            statusText.textContent =
                "Inicie a câmera primeiro.";

            return;
        }

        const width = video.videoWidth;
        const height = video.videoHeight;

        canvas.width = width;
        canvas.height = height;

        ctx.drawImage(
            video,
            0,
            0,
            width,
            height
        );

        const areaX =
            Math.floor(width * 0.05);

        const areaY =
            Math.floor(height * 0.40);

        const areaWidth =
            Math.floor(width * 0.90);

        const areaHeight =
            Math.floor(height * 0.20);

        const imageData =
            ctx.getImageData(
                areaX,
                areaY,
                areaWidth,
                areaHeight
            );

        let total = 0;
        let count = 0;

        for (let i = 0; i < imageData.data.length; i += 4) {

            const r = imageData.data[i];
            const g = imageData.data[i + 1];
            const b = imageData.data[i + 2];

            const brightness =
                0.299 * r +
                0.587 * g +
                0.114 * b;

            total += brightness;
            count++;
        }

        const paperBrightness =
            total / count;

        /*
            Consideramos como "1"
            algo significativamente mais
            escuro que o papel.
        */
        threshold =
            paperBrightness * 0.70;

        statusText.textContent =
            "Calibrado! Threshold: " +
            threshold.toFixed(1);
    });


/*
    Botões
*/
document
    .getElementById("start")
    .addEventListener(
        "click",
        startCamera
    );

document
    .getElementById("stop")
    .addEventListener(
        "click",
        stopCamera
    );


/*
    Limpa câmera ao sair.
*/
window.addEventListener(
    "pagehide",
    stopCamera
);

</script>

</body>
</html>
